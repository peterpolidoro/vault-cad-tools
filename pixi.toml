[workspace]
name = "vault-cad-tools"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"
git = "*"

[tasks]
test = "python -m unittest discover -s tests -v"
cli = "python run.py"
doctor = "python run.py doctor"

[target.win-64.tasks]
capture-api = "powershell -NoProfile -File windows/Export-Capabilities.ps1"
